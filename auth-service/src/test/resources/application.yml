spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

  flyway:
    enabled: false

  cloud:
    discovery:
      enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false

security:
  jwt:
    signing:
      private-key: classpath:private.pem
      public-key: classpath:public.pem
      key-id: sign-key-test
    encryption:
      private-key: classpath:encryption-private.pem
      public-key: classpath:encryption-public.pem
      key-id: enc-key-test
    issuer: demo-service
    audience: demo-clients
    access-token:
      ttl-minutes: 15
    refresh-token:
      ttl-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info
