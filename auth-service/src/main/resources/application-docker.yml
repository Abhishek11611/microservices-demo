spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:demodb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

security:
  jwt:
    signing:
      private-key: ${JWT_PRIVATE_KEY:classpath:private.pem}
      public-key: ${JWT_PUBLIC_KEY:classpath:public.pem}
      key-id: sign-key-2026-1
    encryption:
      private-key: ${JWT_ENCRYPTION_PRIVATE_KEY:classpath:encryption-private.pem}
      public-key: ${JWT_ENCRYPTION_PUBLIC_KEY:classpath:encryption-public.pem}
      key-id: enc-key-2026-1
    issuer: demo-service
    audience: demo-clients
    access-token:
      ttl-minutes: 15