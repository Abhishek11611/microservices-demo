spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/demodb
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    signing:
      public-key: ${JWT_PUBLIC_KEY:classpath:public.pem}
      key-id: sign-key-2026-1

    encryption:
      private-key: ${JWT_ENCRYPTION_PRIVATE_KEY:classpath:encryption-private.pem}
      key-id: enc-key-2026-1

    issuer: demo-service
    audience: users-clients

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: user-group1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer