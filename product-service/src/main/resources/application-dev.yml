
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dev_product_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# Video training configuration
training:
  video:
    upload-dir: C:/ecommerce-training/videos

  audio:
    output-dir: C:/ecommerce-training/audio

  ffmpeg:
    path: 'C:/Users/HP/AppData/Local/Microsoft/WinGet/Packages/Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe/ffmpeg-9.0.2-full_build/bin/ffmpeg.exe'

  whisper:
    model-path: C:/whisper/models/ggml-base.en.bin
    language: en
    working-dir: C:/

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

security:
  jwt:
    signing:
      public-key: ${JWT_PUBLIC_KEY:classpath:public.pem}
      key-id: sign-key-2026-1

    encryption:
      private-key: ${JWT_ENCRYPTION_PRIVATE_KEY:classpath:encryption-private.pem}
      key-id: enc-key-2026-1

    issuer: demo-service
    audience: product-clients

logging:
  level:
    net.ttddyy.dsproxy: INFO

