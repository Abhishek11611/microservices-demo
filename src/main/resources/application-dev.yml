spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/demodb
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    signing:
      private-key: ${JWT_PRIVATE_KEY:classpath:private.pem}
      public-key: ${JWT_PUBLIC_KEY:classpath:public.pem}
      key-id: sign-key-2026-1
    encryption:
      private-key: ${JWT_ENCRYPTION_PRIVATE_KEY:classpath:encryption-private.pem}
      public-key: ${JWT_ENCRYPTION_PUBLIC_KEY:classpath:encryption-public.pem}
      key-id: enc-key-2026-1

    issuer: demo-service
    audience: demo-clients

    access-token:
      ttl-minutes: 15